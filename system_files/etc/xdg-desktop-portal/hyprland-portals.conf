# Portals for the cobalt (Hyprland) session. Same as the package's
# hyprland-portals.conf, except Settings comes from xdg-desktop-portal-gnome:
# xdg-desktop-portal-gtk doesn't expose GNOME's accent-color, so libadwaita
# apps wouldn't follow the accent picked in Settings > Appearance.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Settings=gnome;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
