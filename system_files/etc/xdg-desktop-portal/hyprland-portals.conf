# Portals for the cobalt (Hyprland) session. Screenshots, screen sharing and
# global shortcuts come from xdg-desktop-portal-hyprland; GNOME's portal
# (xdg-desktop-portal-gnome, installed with GDM) provides the dialogs apps
# open: GNOME's Files-based file chooser, "Open With", camera/microphone
# permission prompts, account info, printing, and the Settings portal with
# GNOME's accent-color (xdg-desktop-portal-gtk lacks it). gtk stays as the
# fallback for each.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Settings=gnome;gtk
org.freedesktop.impl.portal.FileChooser=gnome;gtk
org.freedesktop.impl.portal.AppChooser=gnome;gtk
org.freedesktop.impl.portal.Access=gnome;gtk
org.freedesktop.impl.portal.Account=gnome;gtk
org.freedesktop.impl.portal.Print=gnome;gtk
org.freedesktop.impl.portal.Wallpaper=gnome
# Enforces the camera/microphone/location switches in Settings > Privacy
org.freedesktop.impl.portal.Lockdown=gnome
org.freedesktop.impl.portal.Secret=oo7-portal
