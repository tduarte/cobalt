# GNOME-style lock screen: blurred desktop, big clock, date, password field.

$font = Adwaita Sans

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font Light
    color = rgba(255, 255, 255, 0.95)
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 20
    font_family = $font
    color = rgba(255, 255, 255, 0.85)
    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 24
    inner_color = rgba(255, 255, 255, 0.1)
    outer_color = rgba(255, 255, 255, 0.15)
    check_color = rgba(53, 132, 228, 0.9)
    fail_color = rgba(224, 27, 36, 0.9)
    font_color = rgba(255, 255, 255, 0.9)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
