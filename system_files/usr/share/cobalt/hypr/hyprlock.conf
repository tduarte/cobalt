# GNOME-style lock screen: blurred desktop, big clock and date, your avatar
# and name above the password field, what's playing, and Restart / Power Off.
# cobalt-lock adds the avatar and name (and the accent color) at lock time.

$font = Adwaita Sans

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font Light
    color = rgba(255, 255, 255, 0.95)
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 20
    font_family = $font
    color = rgba(255, 255, 255, 0.85)
    position = 0, -230
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 24
    inner_color = rgba(255, 255, 255, 0.1)
    outer_color = rgba(255, 255, 255, 0.15)
    # The accent; cobalt-lock swaps in the one picked in Settings > Appearance
    check_color = rgba(53, 132, 228, 0.9)
    fail_color = rgba(224, 27, 36, 0.9)
    font_color = rgba(255, 255, 255, 0.9)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -90
    halign = center
    valign = center
}

# What's playing (empty without a player); click to play or pause. The media
# keys work while locked too.
label {
    monitor =
    text = cmd[update:2000] cobalt-lock media
    font_size = 13
    font_family = $font
    color = rgba(255, 255, 255, 0.85)
    position = 0, 48
    halign = center
    valign = bottom
    onclick = playerctl play-pause
}

# Restart and Power Off, like GNOME 49's lock screen. They ask apps to close
# first and do nothing if one is still open (unsaved work).
label {
    monitor =
    text = Restart
    font_size = 12
    font_family = $font Bold
    color = rgba(255, 255, 255, 0.8)
    position = -150, 40
    halign = right
    valign = bottom
    onclick = cobalt-lock power restart
}

label {
    monitor =
    text = Power Off
    font_size = 12
    font_family = $font Bold
    color = rgba(255, 255, 255, 0.8)
    position = -40, 40
    halign = right
    valign = bottom
    onclick = cobalt-lock power poweroff
}
